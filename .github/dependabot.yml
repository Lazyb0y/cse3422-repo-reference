# Dependabot opens pull requests for outdated dependencies every week.
# Uncomment the block for your stack and set its directory once your code exists (Class 7 explains this file).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

